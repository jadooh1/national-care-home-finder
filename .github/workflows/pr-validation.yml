# Validates pull requests into main (cutover) and development (WA work).
# contents: read. No secrets, deploy, or database access.
# Push events stay limited to development.
name: Pull request validation

on:
  pull_request:
    branches:
      - main
      - development
      - feature/north-carolina-roster-ingestion
      - feature/delaware-roster-ingestion
      - feature/nationwide-ingestion-framework
      - feature/ingestion-baseline-manifest
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-routable placeholders so Next can inline public env names.
      # These are not credentials and do not select a Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential
    steps:
      - name: Check out pull request
        # actions/checkout v4.4.0 — commit tag verified against actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # actions/setup-node v4.4.0 — commit tag verified against actions/setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install existing dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check latest administrator request wins
        run: node --experimental-strip-types --test supabase/proposals/tests/phase5j_admin_listing_requests.ts

      - name: Check administrator actions run once
        run: node --experimental-strip-types --test supabase/proposals/tests/phase5k_admin_action_submissions.ts

      - name: Check administrator action recovery
        run: node --experimental-strip-types --test supabase/proposals/tests/phase5l_admin_action_recovery.ts

      - name: Check the Washington family journey
        run: node --experimental-strip-types --test supabase/proposals/tests/family_washington_journey.ts

      - name: Check Washington directory search reliability
        run: node --experimental-strip-types --test supabase/proposals/tests/washington_directory_search_reliability.ts

      - name: Check Washington directory page recovery
        run: node --experimental-strip-types --test supabase/proposals/tests/washington_directory_page_recovery.ts

      - name: Check the Washington facility shortlist
