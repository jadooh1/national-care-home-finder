# Validates the development branch. contents: read.
# No secrets, deploy, or database access. This does not run for main.
name: Pull request validation

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-routable placeholders so Next can inline public env names.
      # These are not credentials and do not select a Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential
    steps:
      - name: Check out pull request
        # actions/checkout v4.4.0 — commit tag verified against actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # actions/setup-node v4.4.0 — commit tag verified against actions/setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install existing dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check latest administrator request wins
        run: node --experimental-strip-types --test supabase/proposals/tests/phase5j_admin_listing_requests.ts

      - name: Check administrator actions run once
        run: node --experimental-strip-types --test supabase/proposals/tests/phase5k_admin_action_submissions.ts

      - name: Check administrator action recovery
        run: node --experimental-strip-types --test supabase/proposals/tests/phase5l_admin_action_recovery.ts

      - name: Check the Washington family journey
        run: node --experimental-strip-types --test supabase/proposals/tests/family_washington_journey.ts

      - name: Check the owner-claim review guard
        run: node --experimental-strip-types --test supabase/proposals/tests/owner_claim_review_guard.ts

      - name: Check the Oregon adult foster home dry run
        run: node --experimental-strip-types --test supabase/proposals/tests/oregon_odhs_roster.ts

      - name: Check the development Oregon directory
        run: node --experimental-strip-types --test supabase/proposals/tests/oregon_development_directory.ts

      - name: Check the Oregon public directory
        run: node --experimental-strip-types --test supabase/proposals/tests/oregon_public_directory.ts

      - name: Check the Washington public index
        run: node --experimental-strip-types --test supabase/proposals/tests/washington_public_indexing.ts

      - name: Check the language selector
        run: node --experimental-strip-types --test supabase/proposals/tests/bilingual_language.ts

      - name: Check the Option A premium ledger
        run: node --experimental-strip-types --test supabase/proposals/tests/premium_option_a.ts

      - name: Check visitor feedback and analytics preparation
        run: node --experimental-strip-types --test supabase/proposals/tests/visitor_feedback_and_analytics.ts

      - name: Check the state directory preparation
        run: node --experimental-strip-types --test supabase/proposals/tests/state_directory_preparation.ts

      - name: Check the state refresh gate
        run: node --experimental-strip-types --test supabase/proposals/tests/state_refresh.ts

      - name: Check the state onboarding gate
        run: node --experimental-strip-types --test supabase/proposals/tests/state_onboarding.ts

      - name: Check the California CDSS source validation
        run: node --experimental-strip-types --test supabase/proposals/tests/california_cdss_roster.ts

      - name: Check the Washington DSHS reconciliation
        run: python -m unittest discover -s scripts/dshs -p "test_*.py"

      - name: Build
        run: npm run build
