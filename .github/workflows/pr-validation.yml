      - name: Check the Washington visit checklist
        run: node --experimental-strip-types --test supabase/proposals/tests/washington_family_visit.ts

      - name: Check the comparison visit link
        run: node --experimental-strip-types --test supabase/proposals/tests/washington_comparison_visit.ts

      - name: Check the printable Washington comparison
        run: node --experimental-strip-types --test supabase/proposals/tests/washington_print_comparison.ts

      - name: Check the Washington family journey audit
        run: node --experimental-strip-types --test supabase/proposals/tests/washington_family_journey_audit.ts

      - name: Check the owner-claim review guard
